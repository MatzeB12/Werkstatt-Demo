<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Werkstatt Demo</title>

    <!-- Wichtig: relative Pfade, damit es auch in /werkstatt-demo/ auf GitHub Pages klappt -->
    <link rel="stylesheet" href="./assets/styles.css" />
    <script defer src="./assets/script.js"></script>
</head>

<body>
<header class="site-header">

    <div class="container header-inner">
        <div class="brand">KFZ-Werkstatt Demo</div>
        <nav class="nav">
            <a href="#leistungen">Leistungen</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
    </div>
</header>

<section class="masthead" aria-label="Werkstatt-Header">
    <div class="container">
        <picture>
            <source srcset="./assets/kf16-header.webp" type="image/webp">
            <img class="masthead-banner"
                 src="./assets/kf16-header.jpg"
                 alt="KFZ-Werkstatt KF16 – Kai Fischer"
                 loading="eager" decoding="async">
        </picture>
    </div>
</section>

<main class="container">
    <section class="hero">
        <h1>Autoreparatur & Inspektion</h1>
        <p>Demoseite zur Vorführung – schnell, modern, ohne Baukasten.</p>
        <div class="actions">
            <a class="btn" href="tel:+4933708929634">Anrufen</a>
            <a class="btn secondary" href="kontakt.html">Kontakt</a>

        </div>
    </section>

    <section id="leistungen">
        <h2>Leistungen</h2>
        <div class="grid">
            <div class="card">Autoreparatur</div>
            <div class="card">Inspektion</div>
            <div class="card">Schnellservice</div>
        </div>
    </section>


</main>

<footer class="footer">
    <div class="container">
        <small>Demoversion – nicht die offizielle Website der Werkstatt.</small>
    </div>
</footer>
</body>
</html>
